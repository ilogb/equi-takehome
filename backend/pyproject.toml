[project]
name = "backend"
version = "0.1.0"
description = "Document-intelligence API and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "openai>=3.40,<4",
    "cryptography>=43",
    "itsdangerous>=2.2",
    "httpx>=0.27",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11.10",
    "beautifulsoup4>=4.15.0",
    "pandas>=3.1.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = ["pytest>=8.3", "testcontainers[postgresql]>=4.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
